[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "differential_skeletons"
version = "0.1.1"
description = "Differentiable skeletal kinematic models for pose, animation, and FK-based learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "DifferentialSkeletons Contributors"}
]
keywords = ["kinematics", "pose-estimation", "forward-kinematics", "skeleton", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "ruff>=0.0.241",
]
docs = [
  "Sphinx>=7.2",
  "sphinx-rtd-theme>=2.0",
]
playground = [
  "PyOpenGL>=3.1",
  "pyqtgraph>=0.13",
  "PySide6>=6.7"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
